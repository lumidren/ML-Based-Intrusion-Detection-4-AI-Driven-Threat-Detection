[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nids"
version = "0.1.0"
description = "ML-based network intrusion detection: leak-free CIC-IDS2017/2018 pipeline, CICFlowMeter-compatible feature extractor, calibrated gradient-boosted detectors, explainability, streaming inference, alerting, drift monitoring."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "lumidren" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "polars>=1.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "shap>=0.46",
  "scapy>=2.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "mlflow>=2.16",
  "optuna>=4.0",
  "river>=0.21",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "structlog>=24.4",
  "typer>=0.12",
  "rich>=13.8",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "confluent-kafka>=2.5",
  "redis>=5.0",
  "orjson>=3.10",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
  "great-expectations>=1.0",
  "pandas-stubs",
  "types-PyYAML",
  "types-redis",
]

[project.scripts]
nids = "nids.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nids"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF", "PL", "PERF"]
ignore = ["PLR0913", "PLR2004", "S101", "S311", "RUF012", "PLR0912", "PLR0915", "C901", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "B011", "E501"]
"src/nids/data/schema.py" = ["E501"]
"src/nids/cli.py" = ["B008"]
"src/nids/logging.py" = ["S110"]
"src/nids/features/synth.py" = ["PLR0917"]
"scripts/**" = ["S", "PLR", "E501"]
"src/nids/data/profile.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "src"
packages = ["nids"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "scapy.*", "lightgbm.*", "xgboost.*", "shap.*", "sklearn.*", "mlflow.*", "optuna.*",
  "river.*", "confluent_kafka.*", "pyarrow.*", "matplotlib.*", "great_expectations.*",
  "redis.*", "dpkt.*", "prometheus_client.*", "structlog.*", "psycopg.*", "pandas.*", "scipy.*", "joblib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=nids --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
  "slow: long-running tests (real datasets, benchmarks)",
  "integration: needs external services (Kafka, Postgres)",
  "realdata: needs data/raw populated",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["src/nids"]
omit = ["src/nids/cli.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
